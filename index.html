<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sadia ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         BACKGROUND MUSIC
    ====================================== -->

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <!-- =====================================
         START SCREEN
    ====================================== -->

    <div id="startScreen">

        <div class="startContent">

            <div class="startHeart">❤️</div>

            <h1>Something Special</h1>

            <p>Tap below to begin</p>

            <button id="startBtn">
                Start ❤️
            </button>

        </div>

    </div>


    <!-- =====================================
         PARTICLE HEART INTRO
    ====================================== -->

    <div id="particleIntro">

        <canvas id="heartCanvas"></canvas>

        <div id="sadiaText">
            <span>Sadia</span>
        </div>

    </div>


    <!-- =====================================
         MAIN PROPOSAL
    ====================================== -->

    <main id="mainContent">

        <div class="proposalCard">

            <div class="smallHeart">
                ❤️
            </div>


            <h1>Sadia</h1>


            <img
                src="her-photo.jpg"
                alt="Sadia"
                class="herPhoto"
            >


            <h2>
                I have something special
                to tell you...
            </h2>


            <p class="message">

                Some people come into our life
                and make everything feel a little
                more beautiful. ❤️

                <br><br>

                And you are one of those special
                people.

            </p>


            <button id="continueBtn">
                Continue ❤️
            </button>


            <!-- =================================
                 FINAL MESSAGE
            ================================== -->

            <div id="finalMessage">

                <div class="finalHeart">
                    💖
                </div>

                <h2>
                    Sadia ❤️
                </h2>

                <p>
                    Will you be a special part
                    of my life?
                </p>


                <div class="buttons">

                    <button id="yesBtn">
                        Yes ❤️
                    </button>

                    <button id="ofCourseBtn">
                        Of course 💖
                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
